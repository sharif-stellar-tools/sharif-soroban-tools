[package]
name = "sharif-soroban-tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sharif-soroban-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = "0.200"
colored = "2"
stellar-xdr = { version = "21.0.0", features = ["std", "base64"] }

[dev-dependencies]
tempfile = "3"
arbitrary = "1"

[workspace]
members = ["."]
exclude = ["tests/fixtures/fixture-contracts"]

